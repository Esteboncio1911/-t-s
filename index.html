<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léxico — Diccionario</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --ink-light: #3d3020;
    --parchment: #f5f0e8;
    --parchment-dark: #ece5d3;
    --accent: #8b2e00;
    --accent-gold: #b8860b;
    --border: #c8b99a;
    --shadow: rgba(26,18,8,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(184,134,11,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(139,46,0,0.05) 0%, transparent 60%);
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 60px 40px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 56px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 40px;
  }

  .logo-top {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent-gold);
    font-weight: 300;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(52px, 8vw, 82px);
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .tagline {
    font-size: 16px;
    color: var(--ink-light);
    font-style: italic;
    margin-top: 10px;
    opacity: 0.7;
  }

  .rule {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 28px;
    justify-content: center;
  }
  .rule span { width: 80px; height: 1px; background: var(--border); }
  .rule-diamond { width: 6px; height: 6px; background: var(--accent-gold); transform: rotate(45deg); }

  /* Search */
  .search-box {
    display: flex;
    border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);
    border-radius: 2px;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
    box-shadow: 0 2px 16px var(--shadow);
    margin-bottom: 12px;
  }

  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 4px 24px rgba(139,46,0,0.12);
  }

  .search-label {
    padding: 0 20px;
    display: flex;
    align-items: center;
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--accent);
    border-right: 1px solid var(--border);
    background: rgba(248,244,236,0.8);
    user-select: none;
  }

  #searchInput {
    flex: 1;
    border: none;
    background: transparent;
    padding: 20px 24px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px;
    color: var(--ink);
    outline: none;
    font-style: italic;
  }

  #searchInput::placeholder { color: var(--border); font-style: italic; }

  #searchBtn {
    padding: 0 28px;
    background: var(--accent);
    border: none;
    color: var(--parchment);
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    font-weight: 600;
  }

  #searchBtn:hover { background: var(--ink); }

  /* Suggestions dropdown */
  #suggestions {
    position: relative;
    margin-bottom: 32px;
  }

  .suggestions-list {
    background: rgba(250,247,240,0.98);
    border: 1px solid var(--border);
    border-top: none;
    box-shadow: 0 8px 24px var(--shadow);
    overflow: hidden;
  }

  .suggestion-item {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 12px 24px;
    cursor: pointer;
    border-bottom: 1px solid rgba(200,185,154,0.3);
    transition: background 0.15s;
  }

  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: rgba(139,46,0,0.05); }

  .sug-word {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-style: italic;
    color: var(--ink);
  }

  .sug-word mark {
    background: none;
    color: var(--accent);
    font-style: normal;
    font-weight: 700;
  }

  .sug-type {
    font-size: 13px;
    color: var(--accent-gold);
    font-style: italic;
    opacity: 0.8;
  }

  /* Alphabet index */
  .alphabet-index {
    margin-bottom: 36px;
  }

  .alphabet-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--border);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .alphabet-letters {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .alpha-btn {
    padding: 4px 9px;
    background: transparent;
    border: 1px solid var(--border);
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 1px;
  }

  .alpha-btn:hover, .alpha-btn.active {
    background: var(--accent);
    color: var(--parchment);
    border-color: var(--accent);
  }

  .alpha-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Word list */
  #wordList {
    margin-bottom: 40px;
  }

  .word-list-title {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent-gold);
    font-weight: 600;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .word-list-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }

  .word-chip {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 1px;
  }

  .word-chip:hover {
    background: var(--parchment-dark);
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px var(--shadow);
  }

  .chip-word {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--ink);
  }

  .chip-type {
    font-size: 12px;
    color: var(--accent-gold);
    opacity: 0.8;
    font-style: italic;
    flex: 1;
    text-align: right;
    white-space: nowrap;
  }

  /* Entry card */
  #result { animation: fadeIn 0.45s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 44px 48px;
    box-shadow: 0 4px 32px var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .entry-card::before {
    content: '§';
    position: absolute;
    top: 16px;
    right: 24px;
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    color: var(--border);
    opacity: 0.4;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--accent-gold);
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
    margin-bottom: 28px;
    opacity: 0.8;
    transition: opacity 0.2s;
  }

  .back-btn:hover { opacity: 1; }

  .entry-word {
    font-family: 'Playfair Display', serif;
    font-size: 46px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 10px;
  }

  .entry-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .entry-type {
    font-size: 14px;
    font-style: italic;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 2px 10px;
    border-radius: 1px;
    font-weight: 300;
  }

  .entry-pronunciation {
    font-size: 15px;
    color: var(--ink-light);
    opacity: 0.6;
    font-style: italic;
  }

  .entry-divider {
    height: 1px;
    background: linear-gradient(to right, var(--accent-gold), var(--border), transparent);
    margin-bottom: 28px;
  }

  .entry-section-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent-gold);
    font-weight: 600;
    margin-bottom: 12px;
  }

  .entry-definition {
    font-size: 19px;
    line-height: 1.75;
    color: var(--ink);
    font-weight: 300;
    margin-bottom: 28px;
  }

  .entry-example {
    font-style: italic;
    color: var(--ink-light);
    font-size: 17px;
    padding-left: 20px;
    border-left: 2px solid var(--accent-gold);
    margin-bottom: 24px;
    line-height: 1.6;
    opacity: 0.8;
  }

  .entry-sinonimos {
    margin-bottom: 28px;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .tag {
    background: rgba(184,134,11,0.08);
    border: 1px solid rgba(184,134,11,0.3);
    padding: 3px 12px;
    font-size: 15px;
    font-style: italic;
    color: var(--ink-light);
    border-radius: 1px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tag:hover { background: rgba(139,46,0,0.07); border-color: var(--accent); color: var(--accent); }

  /* Conjugation button */
  .conjugate-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.25s;
    text-transform: uppercase;
    border-radius: 1px;
  }

  .conjugate-btn:hover { background: var(--accent); color: var(--parchment); }
  .conjugate-btn svg { transition: transform 0.3s; }
  .conjugate-btn.open svg { transform: rotate(180deg); }

  /* Conjugation table */
  #conjugationPanel { margin-top: 32px; animation: fadeIn 0.4s ease; }

  .conj-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  .conj-tense {
    background: rgba(248,244,236,0.8);
    border: 1px solid var(--border);
    padding: 20px 24px;
    border-radius: 1px;
  }

  .conj-tense-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }

  .conj-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 0;
    border-bottom: 1px dotted rgba(200,185,154,0.4);
    font-size: 16px;
  }

  .conj-row:last-child { border-bottom: none; }

  .conj-pronoun {
    color: var(--ink-light);
    opacity: 0.7;
    font-size: 14px;
    font-style: italic;
    min-width: 95px;
  }

  .conj-form { font-weight: 600; color: var(--ink); }

  /* Not found */
  .not-found {
    text-align: center;
    padding: 60px 40px;
    color: var(--ink-light);
  }

  .not-found-word {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    font-style: italic;
    color: var(--border);
    margin-bottom: 16px;
  }

  .not-found p {
    font-size: 17px;
    font-style: italic;
    opacity: 0.6;
    line-height: 1.7;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    padding: 14px 20px;
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--border);
    border-radius: 1px;
    font-size: 13px;
    color: var(--ink-light);
    letter-spacing: 0.05em;
    flex-wrap: wrap;
    gap: 10px;
  }

  .stats-bar strong {
    font-family: 'Playfair Display', serif;
    color: var(--accent);
    font-size: 17px;
    font-style: italic;
  }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 60px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--ink-light);
    opacity: 0.45;
    letter-spacing: 0.05em;
  }

  @media (max-width: 600px) {
    .page { padding: 36px 20px; }
    .entry-card { padding: 28px 24px; }
    .entry-word { font-size: 34px; }
    h1 { font-size: 52px; }
    .word-list-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <p class="logo-top">Diccionario Personal</p>
    <h1>Léxico</h1>
    <p class="tagline">El saber de las palabras, a tu alcance.</p>
    <div class="rule">
      <span></span>
      <div class="rule-diamond"></div>
      <span></span>
    </div>
  </header>

  <!-- Search -->
  <div class="search-box">
    <div class="search-label">A</div>
    <input type="text" id="searchInput" placeholder="Buscar una palabra…" autocomplete="off" />
    <button id="searchBtn">Buscar</button>
  </div>
  <div id="suggestions"></div>

  <!-- Main content area -->
  <div id="mainContent"></div>
  <div id="result"></div>

  <footer>Léxico · Tu diccionario personal</footer>
</div>

<script>
let dictionary = [];
let currentEntry = null;
let conjugationOpen = false;

// ── Load data ───────────────────────────────────────────────────
async function loadDictionary() {
  try {
    const r = await fetch('./palabras.json');
    if (!r.ok) throw new Error('No se pudo cargar palabras.json');
    const data = await r.json();
    dictionary = data.palabras.sort((a, b) =>
      a.palabra.localeCompare(b.palabra, 'es', { sensitivity: 'base' })
    );
    renderHome();
  } catch (e) {
    document.getElementById('mainContent').innerHTML = `
      <div class="not-found">
        <p class="not-found-word">Error</p>
        <p>No se pudo cargar el archivo <code>palabras.json</code>.<br>
        Asegúrate de que está en la misma carpeta que <code>index.html</code>.</p>
      </div>`;
  }
}

// ── Home view ────────────────────────────────────────────────────
function renderHome(filterLetter = null) {
  document.getElementById('result').innerHTML = '';
  currentEntry = null;
  conjugationOpen = false;

  const total = dictionary.length;
  const verbCount = dictionary.filter(w => w.es_verbo).length;

  // Filter
  const words = filterLetter
    ? dictionary.filter(w => w.palabra[0].toLowerCase() === filterLetter.toLowerCase())
    : dictionary;

  // Alphabet index — only show letters that have words
  const letters = [...new Set(dictionary.map(w => w.palabra[0].toUpperCase()))].sort();
  const alphaHtml = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => {
    const has = letters.includes(l);
    const active = filterLetter && filterLetter.toUpperCase() === l;
    return `<button class="alpha-btn${active ? ' active' : ''}"
      ${!has ? 'disabled' : ''}
      onclick="${has ? `filterByLetter('${l}')` : ''}">${l}</button>`;
  }).join('');

  const wordChips = words.map(w => `
    <div class="word-chip" onclick="showEntry('${escHtml(w.palabra)}')">
      <span class="chip-word">${w.palabra}</span>
      <span class="chip-type">${w.tipo}</span>
    </div>`).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="stats-bar">
      <span>Total de palabras: <strong>${total}</strong></span>
      <span>Verbos: <strong>${verbCount}</strong></span>
      <span>Otras: <strong>${total - verbCount}</strong></span>
    </div>

    <div class="alphabet-index">
      <p class="alphabet-label">Índice alfabético</p>
      <div class="alphabet-letters">${alphaHtml}
        ${filterLetter ? `<button class="alpha-btn" onclick="renderHome()" style="border-color:var(--accent);color:var(--accent)">✕ Limpiar</button>` : ''}
      </div>
    </div>

    <div id="wordList">
      <p class="word-list-title">
        ${filterLetter ? `Palabras con "${filterLetter.toUpperCase()}" — ${words.length} encontradas` : 'Todas las palabras'}
      </p>
      <div class="word-list-grid">${wordChips}</div>
    </div>`;
}

function filterByLetter(l) { renderHome(l); }

// ── Show entry ──────────────────────────────────────────────────
function showEntry(wordName) {
  const entry = dictionary.find(w =>
    w.palabra.toLowerCase() === wordName.toLowerCase()
  );
  if (!entry) return;

  currentEntry = entry;
  conjugationOpen = false;
  document.getElementById('mainContent').innerHTML = '';
  document.getElementById('suggestions').innerHTML = '';
  document.getElementById('searchInput').value = entry.palabra;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  renderEntry(entry);
}

function renderEntry(e) {
  const sinonimosHtml = e.sinonimos?.length
    ? `<div class="entry-sinonimos">
        <p class="entry-section-label">Sinónimos</p>
        <div class="tag-list">${e.sinonimos.map(s =>
          `<span class="tag" onclick="showEntry('${escHtml(s)}')" title="Buscar '${escHtml(s)}'">${s}</span>`
        ).join('')}</div>
       </div>`
    : '';

  const conjugateBtn = e.es_verbo && e.conjugaciones
    ? `<button class="conjugate-btn" id="conjugateBtn" onclick="toggleConjugation()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        Ver conjugaciones
      </button>`
    : '';

  const resultEl = document.getElementById('result');
  resultEl.innerHTML = `
    <div class="entry-card">
      <button class="back-btn" onclick="renderHome()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Volver al índice
      </button>

      <p class="entry-word">${e.palabra}</p>
      <div class="entry-meta">
        <span class="entry-type">${e.tipo}</span>
        ${e.pronunciacion ? `<span class="entry-pronunciation">[ ${e.pronunciacion} ]</span>` : ''}
      </div>
      <div class="entry-divider"></div>

      <p class="entry-section-label">Definición</p>
      <p class="entry-definition">${e.definicion}</p>

      ${e.ejemplo ? `<p class="entry-example">"${e.ejemplo}"</p>` : ''}

      ${sinonimosHtml}
      ${conjugateBtn}
      <div id="conjugationPanel" style="display:none"></div>
    </div>`;
}

// ── Conjugations ─────────────────────────────────────────────────
function toggleConjugation() {
  const panel = document.getElementById('conjugationPanel');
  const btn = document.getElementById('conjugateBtn');
  if (!panel || !currentEntry?.conjugaciones) return;

  conjugationOpen = !conjugationOpen;
  btn.classList.toggle('open', conjugationOpen);

  if (!conjugationOpen) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';
  const conj = currentEntry.conjugaciones;
  const pronouns = ['yo', 'tú', 'él/ella', 'nosotros', 'vosotros', 'ellos/ellas'];

  const tensesHtml = Object.entries(conj).map(([tense, forms]) => `
    <div class="conj-tense">
      <div class="conj-tense-name">${tense}</div>
      ${pronouns.map(p => forms[p] ? `
        <div class="conj-row">
          <span class="conj-pronoun">${p}</span>
          <span class="conj-form">${forms[p]}</span>
        </div>` : '').join('')}
    </div>`).join('');

  panel.innerHTML = `
    <div style="margin-top:8px">
      <p class="entry-section-label" style="margin-bottom:20px">Tabla de conjugaciones</p>
      <div class="conj-grid">${tensesHtml}</div>
    </div>`;
}

// ── Live search / suggestions ────────────────────────────────────
function getSuggestions(query) {
  if (!query || query.length < 1) return [];
  const q = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return dictionary.filter(w => {
    const normalized = w.palabra.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return normalized.startsWith(q) || normalized.includes(q);
  }).slice(0, 7);
}

function highlightMatch(word, query) {
  const q = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const norm = word.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const idx = norm.indexOf(q);
  if (idx === -1) return word;
  return word.slice(0, idx) + `<mark>${word.slice(idx, idx + query.length)}</mark>` + word.slice(idx + query.length);
}

function renderSuggestions(query) {
  const sugEl = document.getElementById('suggestions');
  if (!query) { sugEl.innerHTML = ''; return; }
  const matches = getSuggestions(query);
  if (!matches.length) { sugEl.innerHTML = ''; return; }

  sugEl.innerHTML = `<div class="suggestions-list">
    ${matches.map(w => `
      <div class="suggestion-item" onclick="showEntry('${escHtml(w.palabra)}')">
        <span class="sug-word">${highlightMatch(w.palabra, query)}</span>
        <span class="sug-type">${w.tipo}</span>
      </div>`).join('')}
  </div>`;
}

// ── Search (on button / enter) ────────────────────────────────────
function search() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  document.getElementById('suggestions').innerHTML = '';

  const exact = dictionary.find(w => w.palabra.toLowerCase() === q.toLowerCase());
  if (exact) { showEntry(exact.palabra); return; }

  const partial = getSuggestions(q);
  if (partial.length === 1) { showEntry(partial[0].palabra); return; }

  // No match
  document.getElementById('mainContent').innerHTML = '';
  document.getElementById('result').innerHTML = `
    <div class="not-found">
      <p class="not-found-word">${escHtml(q)}</p>
      <p>Esta palabra no está en el diccionario todavía.<br>
      Añádela en <code>palabras.json</code> para que aparezca aquí.</p>
    </div>`;
}

// ── Utils ────────────────────────────────────────────────────────
function escHtml(str) {
  return str.replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ── Events ───────────────────────────────────────────────────────
document.getElementById('searchBtn').addEventListener('click', search);
document.getElementById('searchInput').addEventListener('input', e => {
  renderSuggestions(e.target.value.trim());
});
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
  if (e.key === 'Escape') document.getElementById('suggestions').innerHTML = '';
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-box') && !e.target.closest('#suggestions')) {
    document.getElementById('suggestions').innerHTML = '';
  }
});

// ── Init ─────────────────────────────────────────────────────────
loadDictionary();
</script>
</body>
</html>
